<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>For Aila</title>
  </head>
  <body>
    <main class="login-box">
      
      <h1>BESTIE VERIFICATION</h1>

      <p class="login-intro">
        Before you enter this very exclusive birthday website, prove that you're
        really my bespren💙
      </p>

      <form id="loginForm">
        <label for="username">What do I call you?</label>
        <input
          id="username"
          type="text"
          placeholder="Let see..."
          required
        />

        <label for="password">Who is my crush?</label>
        <input
          id="password"
          type="password"
          placeholder="If you know, you know hehe"
          required
        />

        <button type="submit">LET ME IN</button>

        <p id="message"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
